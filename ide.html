<button id="resetEnv"
    class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg transition-all duration-200 flex items-center space-x-2 hover:glow">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
        </path>
    </svg>
    <span>Reset Env</span>
</button>
<br/>
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCLisp Web IDE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <style>
        .editor-container {
            position: relative;
            font-family: 'Fira Code', 'Consolas', monospace;
        }

        .editor {
            background: transparent;
            color: #f8f8f2;
            caret-color: #50fa7b;
            outline: none;
            resize: none;
            white-space: pre;
            overflow-wrap: normal;
            overflow-x: auto;
        }

        .editor::placeholder {
            color: #6272a4;
        }

        .syntax-highlight {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            white-space: pre;
            overflow: hidden;
        }

        .output-line {
            border-left: 3px solid #50fa7b;
            padding-left: 0.75rem;
            margin: 0.25rem 0;
        }

        .error-line {
            border-left: 3px solid #ff5555;
            padding-left: 0.75rem;
            margin: 0.25rem 0;
            color: #ff5555;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .glow {
            box-shadow: 0 0 20px rgba(80, 250, 123, 0.3);
        }

        .glass {
            backdrop-filter: blur(10px);
            background: rgba(40, 42, 54, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900 min-h-screen text-white">
    <!-- Header -->
    <header class="glass border-b border-gray-700 p-4">
        <div class="flex items-center justify-between max-w-7xl mx-auto">
            <div class="flex items-center space-x-3">
                <div
                    class="w-8 h-8 bg-gradient-to-r from-green-400 to-blue-500 rounded-lg flex items-center justify-center">
                    <span class="text-white font-bold text-sm">CC</span>
                </div>
                <h1
                    class="text-2xl font-bold bg-gradient-to-r from-green-400 to-blue-500 bg-clip-text text-transparent">
                    CCLisp IDE
                </h1>
            </div>
            <div class="flex space-x-2">
                <input type="file" id="fileInput" accept=".lisp,.lsp,.cl" class="hidden">
                <button id="openFile"
                    class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg transition-all duration-200 flex items-center space-x-2 hover:glow">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z">
                        </path>
                    </svg>
                    <span>Open File</span>
                </button>
                <button id="saveFile"
                    class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg transition-all duration-200 flex items-center space-x-2 hover:glow">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3-3m0 0l-3 3m3-3v12">
                        </path>
                    </svg>
                    <span>Save</span>
                </button>
                <button id="clearAll"
                    class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg transition-all duration-200 flex items-center space-x-2 hover:glow">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                        </path>
                    </svg>
                    <span>Clear</span>
                </button>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-2 gap-6 h-[calc(100vh-100px)]">
        <!-- Editor Panel -->
        <div class="glass rounded-xl p-6 flex flex-col">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-semibold text-green-400">Code Editor</h2>
                <div class="flex space-x-2">
                    <button id="runCode"
                        class="bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 px-6 py-2 rounded-lg transition-all duration-200 font-semibold flex items-center space-x-2 glow">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M14.828 14.828a4 4 0 01-5.656 0M9 10h1m4 0h1m-6 4h1m4 0h1m-6-8h12a2 2 0 012 2v8a2 2 0 01-2 2H6a2 2 0 01-2-2V8a2 2 0 012-2z">
                            </path>
                        </svg>
                        <span>Run Code</span>
                    </button>
                </div>
            </div>

            <div class="editor-container flex-1 bg-gray-900 rounded-lg p-4 border border-gray-700">
                <textarea id="codeEditor"
                    class="editor w-full h-full bg-transparent border-none resize-none font-mono text-sm leading-relaxed"
                    placeholder=";; Welcome to CCLisp IDE!
;; Type your Lisp code here and press 'Run Code' to execute
;; Example:
(+ 1 2 3)
(defun factorial (n)
(if (<= n 1)
1
(* n (factorial (- n 1)))))
(factorial 5)" spellcheck="false"></textarea>
            </div>

            <div class="mt-4 text-sm text-gray-400">
                Lines: <span id="lineCount">1</span> |
                Characters: <span id="charCount">0</span> |
                <span class="text-green-400">Ready</span>
            </div>
        </div>

        <!-- Output Panel -->
        <div class="glass rounded-xl p-6 flex flex-col">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-semibold text-blue-400">Output Console</h2>
                <button id="clearOutput"
                    class="bg-gray-600 hover:bg-gray-700 px-3 py-1 rounded text-sm transition-all duration-200">
                    Clear
                </button>
            </div>

            <div id="outputContainer"
                class="flex-1 bg-gray-900 rounded-lg p-4 border border-gray-700 overflow-y-auto font-mono text-sm">
                <div class="text-gray-400 italic">
                    🚀 CCLisp Web IDE connected to backend server<br>
                    Output will appear here when you run your code...<br><br>
                    <span class="text-yellow-400">💡 Make sure to start the server with:</span><br>
                    <span class="text-green-400">go run . server</span>
                </div>
            </div>

            <div class="mt-4 flex items-center space-x-4">
                <div class="flex items-center space-x-2">
                    <div id="statusIndicator" class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                    <span id="statusText" class="text-sm text-gray-400">Ready to execute</span>
                </div>
                <div id="executionTime" class="text-sm text-gray-400"></div>
            </div>
        </div>
    </div>

    <!-- Examples Panel -->
    <div class="max-w-7xl mx-auto px-6 pb-6">
        <div class="glass rounded-xl p-6">
            <h3 class="text-lg font-semibold text-purple-400 mb-4">Quick Examples</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <button
                    class="example-btn bg-gray-800 hover:bg-gray-700 p-4 rounded-lg text-left transition-all duration-200 border border-gray-600 hover:border-purple-500"
                    data-code="( (- 10 4) )">
                    <div class="font-semibold text-green-400 mb-1">Basic Arithmetic</div>
                    <div class="text-sm text-gray-400">Simple addition operation</div>
                </button>
                <button
                    class="example-btn bg-gray-800 hover:bg-gray-700 p-4 rounded-lg text-left transition-all duration-200 border border-gray-600 hover:border-purple-500"
                    data-code="((defun fibonacci (n)&#10;  (if (<= n 1)&#10;      n&#10;      (+ (fibonacci (- n 1))&#10;         (fibonacci (- n 2)))))&#10;(fibonacci 10))">
                    <div class="font-semibold text-blue-400 mb-1">Fibonacci</div>
                    <div class="text-sm text-gray-400">Recursive function example</div>
                </button>
                <button
                    class="example-btn bg-gray-800 hover:bg-gray-700 p-4 rounded-lg text-left transition-all duration-200 border border-gray-600 hover:border-purple-500"
                    data-code="( (let ((square (lambda (x) (* x x))))
                    (square 5)) )">
                    <div class="font-semibold text-yellow-400 mb-1">List Operations</div>
                    <div class="text-sm text-gray-400">Working with lists</div>
                </button>
            </div>
        </div>
    </div>

    <script>
        // API client for CCLisp backend
        class LispAPIClient {
            constructor(baseURL = 'http://localhost:8080') {
                this.baseURL = baseURL;
            }

            async executeCode(code) {
                try {
                    const response = await fetch(`${this.baseURL}/api/execute`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ code })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    return await response.json();
                } catch (error) {
                    return {
                        success: false,
                        error: `Connection error: ${error.message}. Make sure the CCLisp server is running on ${this.baseURL}`,
                        execution_time: '0ms'
                    };
                }
            }

            async executeFile(content, filename = null) {
                try {
                    const response = await fetch(`${this.baseURL}/api/file-execute`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ content, filename })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    return await response.json();
                } catch (error) {
                    return {
                        success: false,
                        error: `Connection error: ${error.message}. Make sure the CCLisp server is running on ${this.baseURL}`,
                        execution_time: '0ms'
                    };
                }
            }

            async resetEnvironment() {
                try {
                    const response = await fetch(`${this.baseURL}/api/reset`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        }
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    return await response.json();
                } catch (error) {
                    return {
                        success: false,
                        message: `Connection error: ${error.message}`
                    };
                }
            }
        }

        // IDE functionality
        const codeEditor = document.getElementById('codeEditor');
        const outputContainer = document.getElementById('outputContainer');
        const runButton = document.getElementById('runCode');
        const clearButton = document.getElementById('clearOutput');
        const openFileButton = document.getElementById('openFile');
        const saveFileButton = document.getElementById('saveFile');
        const clearAllButton = document.getElementById('clearAll');
        const resetEnvButton = document.getElementById('resetEnv');
        const fileInput = document.getElementById('fileInput');
        const lineCount = document.getElementById('lineCount');
        const charCount = document.getElementById('charCount');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const executionTime = document.getElementById('executionTime');

        const apiClient = new LispAPIClient();

        // Update editor stats
        function updateStats() {
            const text = codeEditor.value;
            const lines = text.split('\n').length;
            const chars = text.length;

            lineCount.textContent = lines;
            charCount.textContent = chars;
        }

        // Set status
        function setStatus(status, color = 'green') {
            statusText.textContent = status;
            statusIndicator.className = `w-3 h-3 rounded-full ${color === 'green' ? 'bg-green-500 animate-pulse' : color === 'red' ? 'bg-red-500' : 'bg-yellow-500 animate-pulse'}`;
        }

        // Add output to console
        function addOutput(content, isError = false) {
            const line = document.createElement('div');
            line.className = `fade-in ${isError ? 'error-line' : 'output-line'}`;
            line.textContent = content;
            outputContainer.appendChild(line);
            outputContainer.scrollTop = outputContainer.scrollHeight;
        }

        // Clear output
        function clearOutput() {
            outputContainer.innerHTML = '<div class="text-gray-400 italic">Output cleared...</div>';
        }

        // Run code using real API
        async function runCode() {
            const code = codeEditor.value.trim();
            if (!code) {
                addOutput('No code to execute', true);
                return;
            }

            setStatus('Connecting to CCLisp server...', 'yellow');

            // Clear previous output
            outputContainer.innerHTML = '';

            try {
                const result = await apiClient.executeCode(code);

                if (result.success) {
                    if (result.results && result.results.length > 0) {
                        result.results.forEach(res => {
                            addOutput(`=> ${res}`);
                        });
                    } else {
                        addOutput('=> (no output)');
                    }
                    setStatus('Execution completed', 'green');
                } else {
                    addOutput(`Error: ${result.error}`, true);
                    setStatus('Execution failed', 'red');
                }

                executionTime.textContent = `Execution time: ${result.execution_time}`;
            } catch (error) {
                addOutput(`Connection Error: ${error.message}`, true);
                addOutput('Make sure the CCLisp server is running with: go run . server', true);
                setStatus('Connection failed', 'red');
            }
        }

        // Execute file content using real API
        async function executeFileContent(content, filename = null) {
            setStatus('Executing file...', 'yellow');
            outputContainer.innerHTML = '';

            try {
                const result = await apiClient.executeFile(content, filename);

                if (result.success) {
                    if (result.results && result.results.length > 0) {
                        result.results.forEach(res => {
                            addOutput(`=> ${res}`);
                        });
                    } else {
                        addOutput('=> (no output)');
                    }
                    setStatus('File execution completed', 'green');
                } else {
                    addOutput(`Error: ${result.error}`, true);
                    setStatus('File execution failed', 'red');
                }

                executionTime.textContent = `Execution time: ${result.execution_time}`;
            } catch (error) {
                addOutput(`Connection Error: ${error.message}`, true);
                setStatus('Connection failed', 'red');
            }
        }

        // Reset environment
        async function resetEnvironment() {
            if (!confirm('Are you sure you want to reset the environment? All defined variables and functions will be lost.')) {
                return;
            }

            setStatus('Resetting environment...', 'yellow');

            try {
                const result = await apiClient.resetEnvironment();

                if (result.success) {
                    addOutput('Environment reset successfully');
                    setStatus('Environment reset', 'green');
                } else {
                    addOutput(`Reset failed: ${result.message}`, true);
                    setStatus('Reset failed', 'red');
                }
            } catch (error) {
                addOutput(`Connection Error: ${error.message}`, true);
                setStatus('Connection failed', 'red');
            }
        }

        // File operations
        function openFile() {
            fileInput.click();
        }

        function saveFile() {
            const content = codeEditor.value;
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'code.lisp';
            a.click();
            URL.revokeObjectURL(url);
        }

        function clearAll() {
            if (confirm('Are you sure you want to clear all code?')) {
                codeEditor.value = '';
                clearOutput();
                updateStats();
            }
        }

        // Event listeners
        codeEditor.addEventListener('input', updateStats);
        codeEditor.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                runCode();
            }
        });

        runButton.addEventListener('click', runCode);
        clearButton.addEventListener('click', clearOutput);
        openFileButton.addEventListener('click', openFile);
        saveFileButton.addEventListener('click', saveFile);
        clearAllButton.addEventListener('click', clearAll);
        resetEnvButton.addEventListener('click', resetEnvironment);

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const content = e.target.result;
                    codeEditor.value = content;
                    updateStats();

                    // Ask if user wants to execute the file immediately
                    if (confirm(`File "${file.name}" loaded. Do you want to execute it immediately?`)) {
                        await executeFileContent(content, file.name);
                    }
                };
                reader.readAsText(file);
            }
        });

        // Example buttons
        document.querySelectorAll('.example-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const code = btn.dataset.code.replace(/&#10;/g, '\n');
                codeEditor.value = code;
                updateStats();
            });
        });

        // Initialize
        updateStats();
        setStatus('Ready to execute', 'green');
    </script>
</body>

</html>
